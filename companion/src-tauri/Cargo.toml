[package]
name = "wayfinder-companion"
version = "0.3.3"
description = "Local companion map for Wayfinder AI coding voyages"
authors = ["WBXWHT"]
license = "MIT"
repository = "https://github.com/WBXWHT/wayfinder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
