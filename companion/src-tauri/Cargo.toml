[package]
name = "wayfinder-companion"
version = "0.3.10"
description = "Local voyage map for Wayfinder AI collaboration"
authors = ["StayCurious-Xuan"]
license = "MIT"
repository = "https://github.com/StayCurious-Xuan/wayfinder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
notify = "6"
notify-debouncer-mini = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
