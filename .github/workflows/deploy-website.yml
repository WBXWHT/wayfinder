name: Deploy Download Website
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Verify Wayfinder
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-wayfinder-website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.1"
      - name: Require the latest main commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$latest" = "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - name: Require successful CI for the deployed commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (
                run.conclusion !== "success" ||
                run.head_branch !== "main" ||
                run.head_sha !== process.env.DEPLOY_SHA
              ) {
                throw new Error("Deployment requires a successful main CI run");
              }
              return;
            }
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                status: "completed",
                head_sha: process.env.DEPLOY_SHA,
                per_page: 100
              }
            );
            if (!runs.some((run) => run.conclusion === "success")) {
              throw new Error(
                `No successful CI run exists for ${process.env.DEPLOY_SHA}`
              );
            }
      - name: Validate Cloudflare project name
        env:
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          test "$PROJECT_NAME" = "wayfinder-ai"
      - name: Prevent a public version rollback
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const candidate = JSON.parse(
            await readFile("./website/releases.json", "utf8")
          );
          const response = await fetch(
            "https://wayfinder-ai.pages.dev/releases.json",
            { redirect: "follow" }
          );
          if (!response.ok) {
            throw new Error(`Unable to read live release metadata: ${response.status}`);
          }
          const live = await response.json();
          const parts = (value) => String(value).split(".").map(Number);
          const compare = (left, right) => {
            const a = parts(left);
            const b = parts(right);
            for (let index = 0; index < Math.max(a.length, b.length); index += 1) {
              const delta = (a[index] || 0) - (b[index] || 0);
              if (delta) return delta;
            }
            return 0;
          };
          if (compare(candidate.version, live.version) < 0) {
            throw new Error(
              `Refusing to replace public ${live.version} with ${candidate.version}`
            );
          }
          if (
            candidate.version === live.version &&
            live.channel === "stable" &&
            candidate.channel !== "stable"
          ) {
            throw new Error("Refusing to replace a stable release with alpha");
          }
          NODE
      - name: Verify public release downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE' > "$RUNNER_TEMP/wayfinder-downloads.txt"
          (async () => {
          const release = require("./website/releases.json");
          if (release.published !== true) {
            throw new Error("Companion release is not marked public");
          }
          const channels = {
            alpha: {
              tag: `alpha-v${release.version}`,
              assetPrefix: `Wayfinder-Alpha-${release.version}`
            },
            stable: {
              tag: `companion-v${release.version}`,
              assetPrefix: `Wayfinder-${release.version}`
            }
          };
          const channel = channels[release.channel];
          if (!channel) {
            throw new Error(`Unsupported release channel: ${release.channel}`);
          }
          const apiResponse = await fetch(
            `https://api.github.com/repos/StayCurious-Xuan/wayfinder/releases/tags/${channel.tag}`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            }
          );
          if (!apiResponse.ok) {
            throw new Error(
              `Unable to inspect GitHub release: ${apiResponse.status}`
            );
          }
          const githubRelease = await apiResponse.json();
          const assets = new Map(
            githubRelease.assets.map((asset) => [asset.name, asset])
          );
          const checksumAsset = assets.get("SHA256SUMS");
          if (!checksumAsset) {
            throw new Error("Published release is missing SHA256SUMS");
          }
          const checksumResponse = await fetch(
            checksumAsset.browser_download_url,
            { redirect: "follow" }
          );
          if (!checksumResponse.ok) {
            throw new Error(
              `Unable to download SHA256SUMS: ${checksumResponse.status}`
            );
          }
          const checksums = new Map();
          for (const line of (await checksumResponse.text()).split(/\r?\n/)) {
            const match = /^([a-f0-9]{64})\s+\*?(.+)$/.exec(line.trim());
            if (match) {
              checksums.set(match[2], match[1].toLowerCase());
            }
          }
          const downloads = [
            [
              "arm64",
              release.downloads?.arm64,
              `${channel.assetPrefix}-macOS-aarch64.dmg`
            ],
            [
              "x64",
              release.downloads?.x64,
              `${channel.assetPrefix}-macOS-x86_64.dmg`
            ],
            [
              "windowsX64",
              release.downloads?.windowsX64,
              `${channel.assetPrefix}-Windows-x86_64.exe`
            ]
          ];
          for (const [architecture, raw, assetName] of downloads) {
            const url = new URL(raw);
            const expectedPath =
              `/StayCurious-Xuan/wayfinder/releases/download/${channel.tag}/` +
              assetName;
            if (
              url.protocol !== "https:" ||
              url.hostname !== "github.com" ||
              url.pathname !== expectedPath
            ) {
              throw new Error(`Invalid ${architecture} download URL`);
            }
            const asset = assets.get(assetName);
            const digest = String(asset?.digest || "");
            if (!asset || !/^sha256:[a-f0-9]{64}$/i.test(digest)) {
              throw new Error(`GitHub is missing a SHA-256 digest for ${assetName}`);
            }
            if (
              checksums.get(assetName) !==
              digest.slice("sha256:".length).toLowerCase()
            ) {
              throw new Error(`SHA256SUMS does not match ${assetName}`);
            }
            process.stdout.write(`${url.href}\n`);
          }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          while IFS= read -r url; do
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --head \
              --retry 4 \
              --retry-all-errors \
              "$url" > /dev/null
          done < "$RUNNER_TEMP/wayfinder-downloads.txt"
      - name: Deploy the production website
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy website
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=main
            --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify the production website
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const expected = require("./website/releases.json");
          const sleep = (milliseconds) =>
            new Promise((resolve) => setTimeout(resolve, milliseconds));

          (async () => {
            let lastError;
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              try {
                const response = await fetch(
                  `https://wayfinder-ai.pages.dev/releases.json?deployment=${Date.now()}`,
                  { cache: "no-store", redirect: "follow" }
                );
                if (!response.ok) {
                  throw new Error(`Production metadata returned ${response.status}`);
                }
                assert.deepStrictEqual(await response.json(), expected);
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 20) {
                  await sleep(3_000);
                }
              }
            }
            throw new Error(
              `Production deployment did not become current: ${lastError}`
            );
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
