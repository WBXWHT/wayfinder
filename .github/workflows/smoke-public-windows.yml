name: Smoke Public Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        default: alpha-v0.3.10

permissions:
  contents: read

jobs:
  install_and_launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download, install, and launch the public installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG -replace "^alpha-v", ""
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "Unsupported release tag: $env:RELEASE_TAG"
          }

          $release = Get-Content "website/releases.json" -Raw |
            ConvertFrom-Json
          if ($release.version -ne $version -or $release.channel -ne "alpha") {
            throw "Website release metadata does not match $env:RELEASE_TAG"
          }
          $asset = "Wayfinder-Alpha-$version-Windows-x86_64.exe"
          $url = [string]$release.downloads.windowsX64
          $expectedUrl = "https://github.com/$env:REPOSITORY/releases/download/" +
            "$env:RELEASE_TAG/$asset"
          if ($url -ne $expectedUrl) {
            throw "Website Windows URL does not match the requested release"
          }
          $installer = Join-Path $env:RUNNER_TEMP $asset
          $checksumFile = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
          $installDir = Join-Path $env:RUNNER_TEMP "WayfinderSmoke"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Invoke-WebRequest `
            -Uri "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/SHA256SUMS" `
            -OutFile $checksumFile
          if ((Get-Item $installer).Length -lt 1MB) {
            throw "Downloaded installer is unexpectedly small"
          }
          $checksumLine = Get-Content $checksumFile |
            Where-Object { $_ -match [regex]::Escape($asset) } |
            Select-Object -First 1
          if (-not $checksumLine) {
            throw "SHA256SUMS does not contain $asset"
          }
          $expectedHash = ($checksumLine -split "\s+")[0].ToUpperInvariant()
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Downloaded installer checksum does not match SHA256SUMS"
          }

          $install = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList @("/S", "/D=$installDir")
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          $app = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse |
            Where-Object {
              $_.Name -notmatch "uninstall" -and
              $_.VersionInfo.ProductVersion -like "$version*"
            } |
            Select-Object -First 1
          if (-not $app) {
            throw "Installed Wayfinder executable was not found"
          }

          $process = Start-Process -FilePath $app.FullName -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) {
              throw "Wayfinder exited during the launch smoke test"
            }
            Write-Host "Wayfinder $version remained running for 12 seconds."
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
