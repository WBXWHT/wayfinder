name: Verify Published Downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-tarball:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install public tarball
        run: npm install -g https://github.com/WBXWHT/wayfinder/releases/download/v0.3.3/wbxwht-wayfinder-0.3.3.tgz
      - name: Check commands
        run: |
          wayfinder --version
          wayfinder doctor
          wayfinder map
  homebrew:
    runs-on: macos-latest
    steps:
      - name: Install public tap formula
        run: brew install WBXWHT/tap/wayfinder
      - name: Test installed formula
        run: brew test WBXWHT/tap/wayfinder
  scoop:
    runs-on: windows-latest
    steps:
      - name: Install Scoop and public bucket
        shell: pwsh
        run: |
          Invoke-RestMethod https://get.scoop.sh -OutFile install-scoop.ps1
          & ./install-scoop.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add wayfinder https://github.com/WBXWHT/scoop-wayfinder
          scoop install wayfinder
          wayfinder --version
          wayfinder doctor
