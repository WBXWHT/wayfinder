name: Release Desktop Alpha
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-alpha
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.1"
      - name: Verify release version
        id: version
        run: node scripts/verify-companion-version.cjs --prefix alpha-v
      - name: Create or reuse the draft release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          result-encoding: string
          script: |
            const resolveTagCommit = async (tag) => {
              try {
                let ref = (await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag}`
                })).data.object;
                for (let depth = 0; ref.type === "tag" && depth < 5; depth += 1) {
                  ref = (await github.rest.git.getTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_sha: ref.sha
                  })).data.object;
                }
                return ref.sha;
              } catch (error) {
                if (error.status === 404) return undefined;
                throw error;
              }
            };
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            let release = releases.find(
              (item) => item.tag_name === process.env.RELEASE_TAG
            );
            if (!release) {
              try {
                release = (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: process.env.RELEASE_TAG
                })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const tagCommit = await resolveTagCommit(process.env.RELEASE_TAG);
            if (tagCommit && tagCommit !== context.sha) {
              if (!release?.draft) {
                throw new Error(
                  `Release tag points to ${tagCommit}, not workflow commit ${context.sha}`
                );
              }
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.RELEASE_TAG}`,
                sha: context.sha,
                force: true
              });
            }
            if (release && !release.draft) {
              throw new Error(`Refusing to replace published release ${release.html_url}`);
            }
            if (release) {
              release = (await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                target_commitish: context.sha,
                name: `Wayfinder Alpha v${process.env.RELEASE_VERSION}`,
                body: [
                  "Early-access desktop build for macOS and Windows.",
                  "The macOS build is not Apple-notarized. On first launch, use System Settings > Privacy & Security > Open Anyway.",
                  "The Windows build is not code-signed. Microsoft Defender SmartScreen may require More info > Run anyway."
                ].join("\n"),
                draft: true,
                prerelease: true
              })).data;
            } else {
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
                target_commitish: context.sha,
                name: `Wayfinder Alpha v${process.env.RELEASE_VERSION}`,
                body: [
                  "Early-access desktop build for macOS and Windows.",
                  "The macOS build is not Apple-notarized. On first launch, use System Settings > Privacy & Security > Open Anyway.",
                  "The Windows build is not code-signed. Microsoft Defender SmartScreen may require More info > Run anyway."
                ].join("\n"),
                draft: true,
                prerelease: true
              });
              release = response.data;
            }
            return String(release.id);

  build_macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.1"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: companion/src-tauri
      - run: npm ci
      - run: npm run check
        env:
          WAYFINDER_SKIP_UI_TEST: "1"
      - run: npm run build:companion:runtime
      - run: node scripts/build-sea.cjs
      - run: npm run generate:companion-licenses
      - run: npm run build:companion:sidecar
      - run: cargo test --manifest-path companion/src-tauri/Cargo.toml
      - run: npm run build:companion:web
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: companion/src-tauri
          tauriScript: ../../node_modules/.bin/tauri
          args: --target ${{ matrix.target }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Wayfinder-Alpha-macOS-${{ matrix.arch }}-[bundle]"
      - name: Verify the packaged app
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg="$(find "companion/src-tauri/target/${RUST_TARGET}/release/bundle/dmg" \
            -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_point="$(mktemp -d)"
          device=""
          cleanup() {
            if [ -n "$device" ]; then
              hdiutil detach "$device"
            fi
            rm -rf "$mount_point"
          }
          trap cleanup EXIT
          device="$(hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" \
            "$dmg" | awk '/^\/dev\// { print $1; exit }')"
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          actual_version="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$actual_version" = "$RELEASE_VERSION"
          expected_arch="$EXPECTED_ARCH"
          if [ "$expected_arch" = "aarch64" ]; then
            expected_arch="arm64"
          fi
          file "$app/Contents/MacOS/wayfinder-companion" | grep -q "$expected_arch"
          file "$app/Contents/MacOS/wayfinder" | grep -q "$expected_arch"

  build_windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.1"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: companion/src-tauri
      - run: npm ci
      - run: npm run check
        env:
          WAYFINDER_SKIP_UI_TEST: "1"
      - run: npm run build:companion:runtime
      - name: Build Windows sidecar
        shell: pwsh
        run: |
          $license = "$env:RUNNER_TEMP\NODE_LICENSE.txt"
          Invoke-WebRequest `
            "https://raw.githubusercontent.com/nodejs/node/v22.13.1/LICENSE" `
            -OutFile $license
          $env:WAYFINDER_NODE_LICENSE_PATH = $license
          node scripts/build-sea.cjs
      - run: npm run generate:companion-licenses
      - run: npm run build:companion:sidecar
      - run: cargo test --manifest-path companion/src-tauri/Cargo.toml
      - run: npm run build:companion:web
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: companion/src-tauri
          tauriScript: ../../node_modules/.bin/tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Wayfinder-Alpha-Windows-x86_64-[bundle]"
      - name: Verify the packaged installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bundle = "companion/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not produced"
          }
          if ($installer.Length -lt 1MB) {
            throw "Windows NSIS installer is unexpectedly small"
          }
          $app = "companion/src-tauri/target/x86_64-pc-windows-msvc/release/wayfinder-companion.exe"
          $sidecar = "companion/src-tauri/binaries/wayfinder-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $app)) {
            throw "Packaged Windows application binary is missing"
          }
          if (-not (Test-Path $sidecar)) {
            throw "Packaged Windows sidecar is missing"
          }
          if ((Get-Item $app).VersionInfo.ProductVersion -notlike "$env:RELEASE_VERSION*") {
            throw "Windows application version does not match $env:RELEASE_VERSION"
          }

  checksums:
    needs: [prepare, build_macos, build_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Wayfinder-Alpha-macOS-*-dmg
          path: artifacts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Wayfinder-Alpha-Windows-x86_64-nsis
          path: artifacts/windows
      - name: Generate SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          : > SHA256SUMS
          mkdir -p release-assets
          for arch in aarch64 x86_64; do
            file="$(find artifacts -path "*${arch}*" -name '*.dmg' -print -quit)"
            test -n "$file"
            output="release-assets/Wayfinder-Alpha-${VERSION}-macOS-${arch}.dmg"
            cp "$file" "$output"
            hash="$(sha256sum "$output" | cut -d' ' -f1)"
            echo "$hash  Wayfinder-Alpha-${VERSION}-macOS-${arch}.dmg" \
              >> SHA256SUMS
          done
          windows="$(find artifacts -path '*Windows-x86_64*' -name '*.exe' -print -quit)"
          test -n "$windows"
          output="release-assets/Wayfinder-Alpha-${VERSION}-Windows-x86_64.exe"
          cp "$windows" "$output"
          hash="$(sha256sum "$output" | cut -d' ' -f1)"
          echo "$hash  Wayfinder-Alpha-${VERSION}-Windows-x86_64.exe" \
            >> SHA256SUMS
          cp SHA256SUMS release-assets/SHA256SUMS
      - name: Publish verified release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const releaseId = Number(process.env.RELEASE_ID);
            const expectedNames = [
              `Wayfinder-Alpha-${process.env.RELEASE_VERSION}-macOS-aarch64.dmg`,
              `Wayfinder-Alpha-${process.env.RELEASE_VERSION}-macOS-x86_64.dmg`,
              `Wayfinder-Alpha-${process.env.RELEASE_VERSION}-Windows-x86_64.exe`,
              "SHA256SUMS"
            ];
            const listAssets = () => github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100
              }
            );
            const deleteEvery = async (assets) => {
              const errors = [];
              for (const asset of assets) {
                try {
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id
                  });
                } catch (error) {
                  errors.push(error);
                }
              }
              return errors;
            };
            for (const name of expectedNames) {
              if (!fs.existsSync(path.join("release-assets", name))) {
                throw new Error(`Verified release asset is missing: ${name}`);
              }
            }
            const oldAssets = await listAssets();
            for (const name of expectedNames) {
              if (oldAssets.some((asset) => asset.name === name)) continue;
              const backup = oldAssets.find(
                (asset) => asset.name.startsWith(`${name}.backup-`)
              );
              if (backup) {
                await github.rest.repos.updateReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: backup.id,
                  name
                });
                backup.name = name;
              }
            }
            const candidates = [];
            try {
              for (const name of expectedNames) {
                const candidateName = `${name}.candidate-${context.runId}`;
                const staleCandidates = oldAssets.filter(
                  (asset) => asset.name.startsWith(`${name}.candidate-`)
                );
                for (const staleCandidate of staleCandidates) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: staleCandidate.id
                  });
                }
                const data = fs.readFileSync(path.join("release-assets", name));
                const uploaded = await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  name: candidateName,
                  data,
                  headers: {
                    "content-type": name.endsWith(".dmg")
                      ? "application/x-apple-diskimage"
                      : name.endsWith(".exe")
                        ? "application/vnd.microsoft.portable-executable"
                        : "text/plain",
                    "content-length": data.length
                  }
                });
                candidates.push({ name, asset: uploaded.data });
              }
            } catch (error) {
              const runCandidates = (await listAssets()).filter(
                (asset) => asset.name.endsWith(`.candidate-${context.runId}`)
              );
              const cleanupErrors = await deleteEvery(runCandidates);
              if (cleanupErrors.length) {
                throw new AggregateError(
                  [error, ...cleanupErrors],
                  "Candidate upload and cleanup failed"
                );
              }
              throw error;
            }
            const promotions = [];
            try {
              for (const candidate of candidates) {
                const current = oldAssets.find(
                  (asset) => asset.name === candidate.name
                );
                let backup;
                if (current) {
                  const backupName =
                    `${candidate.name}.backup-${context.runId}`;
                  backup = (await github.rest.repos.updateReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: current.id,
                    name: backupName
                  })).data;
                  current.name = backupName;
                }
                const promotion = {
                  ...candidate,
                  candidateName:
                    `${candidate.name}.candidate-${context.runId}`,
                  backup,
                  promoted: false
                };
                promotions.push(promotion);
                await github.rest.repos.updateReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: candidate.asset.id,
                  name: candidate.name
                });
                promotion.promoted = true;
              }
            } catch (error) {
              const rollbackErrors = [];
              for (const promotion of promotions.reverse()) {
                if (promotion.promoted) {
                  try {
                    await github.rest.repos.updateReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: promotion.asset.id,
                      name: promotion.candidateName
                    });
                  } catch (renameError) {
                    try {
                      await github.rest.repos.deleteReleaseAsset({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        asset_id: promotion.asset.id
                      });
                    } catch (deleteError) {
                      rollbackErrors.push(renameError, deleteError);
                    }
                  }
                }
                if (promotion.backup) {
                  try {
                    await github.rest.repos.updateReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: promotion.backup.id,
                      name: promotion.name
                    });
                  } catch (restoreError) {
                    rollbackErrors.push(restoreError);
                  }
                }
              }
              const runCandidates = (await listAssets()).filter(
                (asset) => asset.name.endsWith(`.candidate-${context.runId}`)
              );
              rollbackErrors.push(...await deleteEvery(runCandidates));
              if (rollbackErrors.length) {
                throw new AggregateError(
                  [error, ...rollbackErrors],
                  "Release asset promotion and rollback failed"
                );
              }
              throw error;
            }
            const keep = new Set(expectedNames);
            const cleanupErrors = await deleteEvery(
              (await listAssets()).filter((asset) => !keep.has(asset.name))
            );
            const finalAssets = await listAssets();
            const finalNames = finalAssets.map((asset) => asset.name).sort();
            if (
              finalNames.length !== expectedNames.length ||
              expectedNames.some((name) => !finalNames.includes(name))
            ) {
              cleanupErrors.push(
                new Error(`Draft asset set is incomplete: ${finalNames.join(", ")}`)
              );
            }
            if (cleanupErrors.length) {
              throw new AggregateError(
                cleanupErrors,
                "Release asset cleanup failed"
              );
            }
